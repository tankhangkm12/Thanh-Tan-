# SAMPLE assumptions (tests of calc_capacity.py). One source of truth for every assumption; 00-context/assumptions.md is generated from it.
version: 1
milestones: [launch, 1y, 3y]
assumptions:
  - id: A-dau
    description: Người dùng hoạt động mỗi ngày
    unit: người dùng
    by_milestone: {launch: 1000, 1y: 10000, 3y: 50000}
    source: inputs/ba/prd.md mục 3.1
  - id: A-requests-per-user
    description: Request mỗi người dùng mỗi ngày
    unit: request/người/ngày
    value: 120
    source: inputs/ba/prd.md mục 3.2
  - id: A-peak-factor
    description: Hệ số đỉnh so với trung bình
    unit: lần
    value: 5
    source: người dùng duyệt ở G1
  - id: A-safety-margin
    description: Biên an toàn cộng thêm lên tải đỉnh
    unit: tỉ lệ
    value: 0.3
    source: người dùng duyệt ở G1
  - id: A-orders-per-day
    description: Đơn hàng mới mỗi ngày (trung bình trong giai đoạn kết thúc ở mốc)
    unit: dòng/ngày
    by_milestone: {launch: 0, 1y: 10000, 3y: 20000}
    source: inputs/ba/prd.md mục 4
  - id: A-note-bytes
    description: Độ dài trung bình ghi chú đơn hàng
    unit: byte
    value: 40
    source: ước lượng của BA, inputs/ba/prd.md mục 4
  - id: A-uploads-per-day
    description: File tải lên mỗi ngày
    unit: file/ngày
    by_milestone: {launch: 0, 1y: 2000, 3y: 8000}
    source: inputs/ba/prd.md mục 5
  - id: A-upload-bytes
    description: Kích thước trung bình một file tải lên
    unit: byte
    value: 500000
    source: inputs/ba/prd.md mục 5
  - id: A-views-per-day
    description: Lượt tải xuống file mỗi ngày
    unit: lượt/ngày
    by_milestone: {launch: 0, 1y: 6000, 3y: 24000}
    source: inputs/ba/prd.md mục 5
  - id: A-maxalign
    description: MAXALIGN của PostgreSQL trên máy chủ triển khai
    unit: byte
    value: 8
    platform: x86_64
    source: "đo bằng pg_controldata (dòng 'Maximum data alignment') trên máy đích, https://www.postgresql.org/docs/16/app-pgcontroldata.html; Researcher xác nhận ở G4"
  - id: A-heap-bloat
    description: Hệ số phình heap
    unit: lần
    value: 1.2
    source: giả định mẫu cho test (vacuum tự động bình thường)
  - id: A-index-bloat
    description: Hệ số phình index
    unit: lần
    value: 1.3
    source: giả định mẫu cho test
  - id: A-wal-bytes
    description: Dung lượng WAL giữ lại
    unit: byte
    value: 1073741824
    source: giả định mẫu cho test (1 GiB)
  - id: A-replicas
    description: Số bản sao (replica)
    unit: bản
    value: 1
    source: giả định mẫu cho test (một replica cho sẵn sàng cao)
  - id: A-backups
    description: Số bản backup giữ lại
    unit: bản
    value: 2
    source: giả định mẫu cho test (hai bản gần nhất)
  - id: A-toast-ratio
    description: Tỉ lệ cột độ dài thay đổi vượt ngưỡng TOAST
    unit: tỉ lệ
    value: 0
    source: giả định mẫu cho test
    reason: ghi chú đơn hàng tối đa vài chục byte, không cột nào dài tới ngưỡng TOAST
workload:
  dau: A-dau
  requests_per_user_per_day: A-requests-per-user
  peak_factor: A-peak-factor
  safety_margin: A-safety-margin
database_assumptions:
  order-db:
    maxalign: A-maxalign
    heap_bloat_factor: A-heap-bloat
    index_bloat_factor: A-index-bloat
    wal_bytes: A-wal-bytes
    replicas: A-replicas
    backups: A-backups
    toast_column_ratio: A-toast-ratio
