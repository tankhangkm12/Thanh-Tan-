[project]
name = "thanhtan"
version = "0.8.0"
description = "Shared, domain-agnostic engine for the plugin families in this repo"
authors = [
    { name = "tankhangkm12" }
]
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "mcp>=2.3,<3",
    "pyyaml>=6.0.3",
]

[project.scripts]
thanhtan = "thanhtan.cli:main"
# The name before 1.0.0, kept as an alias: the same program, with a reminder of the new name.
agentflow = "thanhtan.cli:legacy_main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
