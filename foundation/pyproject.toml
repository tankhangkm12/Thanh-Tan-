[project]
name = "agentflow"
version = "0.7.0"
description = "Shared, domain-agnostic engine for the plugin families in this repo"
authors = [
    { name = "tankhangkm12" }
]
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "mcp>=2.3,<3",
    "pyyaml>=6.0.3",
]

[project.scripts]
agentflow = "agentflow.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
